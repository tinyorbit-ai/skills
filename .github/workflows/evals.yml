name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "Which LLM tier to run (static always runs)"
        type: choice
        options: [trigger, behavioral, both]
        default: trigger

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static validation (tier 0)
        run: EVALS_REQUIRE_CLI=1 node evals/static/validate.mjs

  trigger:
    if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'trigger' || inputs.tier == 'both')
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Trigger routing evals (tier 1)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node evals/trigger/run.mjs

  behavioral:
    if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'behavioral' || inputs.tier == 'both')
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Behavioral evals (tier 2)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node evals/behavioral/run.mjs --all --runs 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
